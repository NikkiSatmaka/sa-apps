# Toolchain untuk Portal SA — dikelola dengan mise (https://mise.jdx.dev)
#
# Jalankan `mise install` di root repo untuk memasang versi tool yang di-pin di bawah.
# Versi di-pin agar selaras dengan Dockerfile (build produksi tetap memakai image
# Docker sebagai sumber kebenaran: python:3.14-slim, node:26-alpine, uv 0.13).
#
# Python sengaja TIDAK di-pin di sini: interpreter dikelola uv, versinya mengikuti
# backend/.python-version (uv mengunduhnya otomatis saat `uv sync` / `uv run`).
#
# Semua tool yang dibutuhkan untuk mengembangkan repo ini di-track di sini —
# tambahkan tool baru ke blok [tools] agar seluruh contributor memakai versi sama.

[tools]
codegraph = "latest"
node = "26"
# pnpm: package manager untuk frontend/ (sumber kebenaran dependency via
# package.json + pnpm-lock.yaml). Di-pin ke major 12 selaras dengan Dockerfile
# (install eksplisit `npm i -g pnpm@12`). Tidak memakai corepack — mise pemilik
# tunggal versi pnpm untuk development lokal.
pnpm = "12"
# uv: package manager & build backend untuk backend/ (sumber kebenaran dependency
# via pyproject.toml + uv.lock). Di-pin ke minor 0.13 selaras dengan Dockerfile
# (ghcr.io/astral-sh/uv:0.13) dan build backend uv_build (>=0.13,<0.14).
uv = "0.13"

# Arahkan git ke hook yang di-version di .githooks/ secara otomatis saat masuk
# direktori repo (bagi contributor yang memakai mise). Hook pre-push menolak
# push langsung ke main/master — lihat .githooks/pre-push.
[hooks]
enter = "git config core.hooksPath .githooks"

# Fallback manual bagi yang tidak memakai mise: `mise run setup-hooks`
# (atau langsung `git config core.hooksPath .githooks`).
[tasks.setup-hooks]
description = "Pasang git hooks repo (core.hooksPath -> .githooks)"
run = "git config core.hooksPath .githooks"

[tasks.publish]
description = "Build & push image backend/frontend (versi ditanya per komponen; config dari .env)"
usage = 'arg "[component]" help="backend atau frontend; kosong = keduanya"'
run = "./scripts/publish.sh ${usage_component:-}"

# Task untuk agen dan contributor: output ringkas, tanpa menyentuh stack Compose bersama.
[tasks.new-worktree]
description = "Buat worktree dari origin/main di .worktrees/<slug> (branch <type>/<slug>, --no-track, env + dependensi siap)"
usage = '''
arg "<type>" help="feat | fix | refactor | docs | chore"
arg "<slug>" help="slug kebab-case; nama folder worktree"
flag "--no-install" help="lewati uv sync dan pnpm install"
'''
run = "./scripts/new-worktree.sh ${usage_type} ${usage_slug} ${usage_no_install:+--no-install}"

[tasks.verify-backend]
description = "Verifikasi backend ringkas: unit (default), --integration (Postgres sementara), atau --full (gerbang cakupan gabungan)"
run = "./scripts/verify-backend.sh"

[tasks.verify-frontend]
description = "Verifikasi frontend ringkas: tsc + test (default) atau --full (cakupan + build)"
run = "./scripts/verify-frontend.sh"
