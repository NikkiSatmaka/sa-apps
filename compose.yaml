services:
  db:
    image: postgres:16-alpine
    container_name: sa-portal-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bind ke loopback saja: DB tidak boleh terekspos ke jaringan host.
    # Backend mengakses lewat network internal (db:5432).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - /opt/docker_srv/sa-portal/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sa-network

  # Migration TIDAK dijalankan otomatis di produksi. Jalankan manual setelah
  # backup DB dan sebelum/sesudah mengganti image backend:
  #   docker compose run --rm backend alembic upgrade head
  # (Untuk lokal, compose.local.yaml menjalankan migrate + seed otomatis.)
  backend:
    image: ghcr.io/apeuta/sa-portal-backend:${IMAGE_TAG:-latest}
    container_name: sa-portal-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Default aman untuk produksi: production + demo mode mati. Untuk lokal,
      # isi ENVIRONMENT=development di .env.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-20000}
      LLM_MAX_DOCUMENT_BYTES: ${LLM_MAX_DOCUMENT_BYTES:-10485760}
      GUARDRAIL_PII_DETECTION_ENABLED: ${GUARDRAIL_PII_DETECTION_ENABLED:-true}
      GMAIL_CREDENTIALS: ${GMAIL_CREDENTIALS:-}
      GMAIL_SENDER: ${GMAIL_SENDER:-}
    ports:
      - "8555:8000"
    volumes:
      - /opt/docker_srv/sa-portal/backend-data:/app/data
      - /opt/docker_srv/sa-portal/backend-logs:/app/logs
    networks:
      - sa-network

  frontend:
    image: ghcr.io/apeuta/sa-portal-frontend:${IMAGE_TAG:-latest}
    container_name: sa-portal-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "3535:3000"
    networks:
      - sa-network

networks:
  sa-network:
    driver: bridge
