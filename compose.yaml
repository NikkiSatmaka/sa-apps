services:
  db:
    image: postgres:16-alpine
    container_name: sa-portal-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bind ke loopback saja: DB tidak boleh terekspos ke jaringan host.
    # Backend mengakses lewat network internal (db:5432).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sa-network

  # One-off: jalankan migration Alembic (idempotent: no-op bila sudah di head)
  # lalu exit. Backend baru start setelah ini sukses; bila migration gagal,
  # transaksi di-rollback dan backend tidak naik (fail closed).
  # TIDAK menjalankan seed demo (hanya untuk lokal, lihat compose.local.yaml).
  # Backup DB tetap dilakukan manual sebelum deploy. Migration harus kompatibel
  # mundur (expand/contract) karena rollback image tidak me-rollback schema.
  backend-init:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_OWNER:-nikkisatmaka}/sa-portal-backend:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    command: ["alembic", "upgrade", "head"]
    networks:
      - sa-network

  backend:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_OWNER:-nikkisatmaka}/sa-portal-backend:${IMAGE_TAG:-latest}
    container_name: sa-portal-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Default aman untuk produksi: production + demo mode mati. Untuk lokal,
      # isi ENVIRONMENT=development di .env.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEMO_MODE: ${DEMO_MODE:-false}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-20000}
      LLM_MAX_DOCUMENT_BYTES: ${LLM_MAX_DOCUMENT_BYTES:-10485760}
      GUARDRAIL_PII_DETECTION_ENABLED: ${GUARDRAIL_PII_DETECTION_ENABLED:-true}
      GMAIL_CREDENTIALS: ${GMAIL_CREDENTIALS:-}
      GMAIL_SENDER: ${GMAIL_SENDER:-}
    ports:
      - "8555:8000"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    networks:
      - sa-network

  frontend:
    image: ${IMAGE_REGISTRY:-docker.io}/${IMAGE_OWNER:-nikkisatmaka}/sa-portal-frontend:${IMAGE_TAG:-latest}
    container_name: sa-portal-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "3535:3000"
    networks:
      - sa-network

networks:
  sa-network:
    driver: bridge

# Named volume dengan data fisik di /opt/docker_srv/sa-portal/ (partisi /var
# kecil di produksi). Nama final = <nama stack>_<volume>, jadi nama stack di
# Portainer harus tetap sama.
# Driver `local` + `type: none, o: bind` membuat named volume yang hanya
# menunjuk ke direktori host. Direktori HARUS sudah ada sebelum `up`
# (Docker tidak membuatnya; error "no such file or directory" bila belum):
#   sudo mkdir -p /opt/docker_srv/sa-portal/{postgres-data,backend-data,backend-logs}
# Catatan: konfigurasi volume yang sudah ada tidak berubah otomatis. Volume
# lama di /var/lib/docker harus dimigrasi lalu dihapus (lihat CONTRIBUTING/ops).
volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/docker_srv/sa-portal/postgres-data
  backend-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/docker_srv/sa-portal/backend-data
  backend-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/docker_srv/sa-portal/backend-logs
