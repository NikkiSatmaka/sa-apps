# CI Portal SA — backend (unit + integrasi) dengan laporan dan gerbang cakupan.
#
# Spec induk #49, tiket #57 (laporan) dan #70 (gerbang). Job `cakupan-gabungan`
# MEMBLOK bila cakupan gabungan unit + integrasi: baris < 90% atau cabang < 80%
# (CONSTRAINTS.md). Job frontend ditambahkan di tiket #71 sebagai job baru
# di bawah `jobs:` (pola sama: checkout -> setup -> install -> test), lalu masuk ke
# `needs:` job `cakupan-gabungan`/gerbang bila perlu.
name: CI

on:
  pull_request:
  push:
    # Semua branch kecuali main (main hanya menerima merge lewat PR).
    branches-ignore:
      - main
  workflow_dispatch:

# Izin minimal; tidak ada secret yang dibutuhkan.
permissions:
  contents: read

# Batalkan run lama pada branch/PR yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # seluruh `uv run`/`uv sync` memakai uv.lock apa adanya

jobs:
  backend-unit:
    name: Backend — test unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      COVERAGE_FILE: coverage-unit.data
    steps:
      - uses: actions/checkout@v6

      # Versi uv selaras mise.toml (0.13). Interpreter Python diunduh uv sesuai
      # backend/.python-version saat `uv sync`.
      - name: Pasang uv (dengan cache dependensi)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Pasang dependensi
        run: uv sync --frozen

      - name: Jalankan test unit + cakupan
        run: >-
          uv run pytest -q -W ignore
          --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage-unit.xml

      - name: Unggah data cakupan unit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cakupan-unit
          path: |
            backend/coverage-unit.data
            backend/coverage-unit.xml
          if-no-files-found: warn

  backend-integration:
    name: Backend — test integrasi (Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Kredensial throwaway untuk service container CI, bukan secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # URL menunjuk SERVER; fixture membuat database sementara sa_test_<hex>.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
      TEST_DATABASE_ALLOW_REMOTE: "1"
      COVERAGE_FILE: coverage-integration.data
    steps:
      - uses: actions/checkout@v6

      - name: Pasang uv (dengan cache dependensi)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Pasang dependensi
        run: uv sync --frozen

      - name: Jalankan test integrasi + cakupan
        run: >-
          uv run pytest -q -W ignore -m integration
          --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage-integration.xml

      - name: Unggah data cakupan integrasi
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cakupan-integrasi
          path: |
            backend/coverage-integration.data
            backend/coverage-integration.xml
          if-no-files-found: warn

  cakupan-gabungan:
    name: Backend — ringkasan cakupan gabungan
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration]
    # Tetap jalan walau salah satu job gagal agar cakupan terlihat. Gerbang di bawah
    # tetap gagal bila data tidak lengkap (lihat langkah "Gabungkan").
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Pasang uv (dengan cache dependensi)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Pasang dependensi
        run: uv sync --frozen

      - name: Unduh data cakupan
        uses: actions/download-artifact@v8
        with:
          pattern: cakupan-*
          path: backend/cov-in
          merge-multiple: true

      - name: Gabungkan cakupan unit + integrasi
        run: |
          shopt -s nullglob
          files=(cov-in/*.data)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Tidak ada data cakupan (job unit/integrasi gagal sebelum menghasilkan data)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Gerbang butuh KEDUA data: tanpa salah satunya angka gabungan menyesatkan.
          if [ ! -e cov-in/coverage-unit.data ] || [ ! -e cov-in/coverage-integration.data ]; then
            echo "Data cakupan unit atau integrasi tidak lengkap; gerbang tidak bisa dievaluasi." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export COVERAGE_FILE=coverage-gabungan.data
          uv run coverage combine --keep "${files[@]}"
          uv run coverage xml -o coverage.xml
          uv run coverage json -o coverage.json
          {
            echo "## Cakupan backend (unit + integrasi)"
            echo
            echo "Gerbang memblok: baris >= 90% dan cabang >= 80% (CONSTRAINTS.md)."
            echo
            uv run coverage report --format=markdown --skip-empty
          } >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --skip-empty

      # Gerbang cakupan (#70): dua ambang terpisah dibaca dari data gabungan hasil
      # `coverage combine` di atas (bukan dari cache). Gagal -> job merah.
      - name: Gerbang cakupan (baris >= 90%, cabang >= 80%)
        run: |
          export COVERAGE_FILE=coverage-gabungan.data
          status=0
          uv run python scripts/cakupan_gerbang.py coverage.json > gerbang.txt 2>&1 || status=$?
          cat gerbang.txt
          {
            echo
            echo "### Gerbang cakupan"
            echo '```'
            cat gerbang.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Unggah coverage.xml gabungan
        if: ${{ hashFiles('backend/coverage.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-gabungan
          path: backend/coverage.xml
