# CI Portal SA — backend (unit + integrasi) dan frontend, dengan laporan dan gerbang cakupan.
#
# Spec induk #49 (backend) dan #50 (frontend); tiket #57 (laporan), #70 (gerbang backend),
# #71 (job frontend + gerbang). Job `cakupan-gabungan` MEMBLOK bila cakupan gabungan
# unit + integrasi backend: baris < 90% atau cabang < 80%. Job `frontend` MEMBLOK bila
# cakupan total frontend di bawah ambang yang sama (coverage.thresholds di
# frontend/vitest.config.mts) atau tsc/test/build gagal (CONSTRAINTS.md).
name: CI

on:
  pull_request:
  push:
    # Semua branch kecuali main (main hanya menerima merge lewat PR).
    branches-ignore:
      - main
  workflow_dispatch:

# Izin minimal; tidak ada secret yang dibutuhkan.
permissions:
  contents: read

# Batalkan run lama pada branch/PR yang sama saat ada push baru.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # seluruh `uv run`/`uv sync` memakai uv.lock apa adanya

jobs:
  backend-unit:
    name: Backend — test unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      COVERAGE_FILE: coverage-unit.data
    steps:
      - uses: actions/checkout@v6

      # Versi uv selaras mise.toml (0.13). Interpreter Python diunduh uv sesuai
      # backend/.python-version saat `uv sync`.
      - name: Pasang uv (dengan cache dependensi)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Pasang dependensi
        run: uv sync --frozen

      - name: Jalankan test unit + cakupan
        run: >-
          uv run pytest -q -W ignore
          --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage-unit.xml

      - name: Unggah data cakupan unit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cakupan-unit
          path: |
            backend/coverage-unit.data
            backend/coverage-unit.xml
          if-no-files-found: warn

  backend-integration:
    name: Backend — test integrasi (Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Kredensial throwaway untuk service container CI, bukan secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # URL menunjuk SERVER; fixture membuat database sementara sa_test_<hex>.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/postgres
      TEST_DATABASE_ALLOW_REMOTE: "1"
      COVERAGE_FILE: coverage-integration.data
    steps:
      - uses: actions/checkout@v6

      - name: Pasang uv (dengan cache dependensi)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Pasang dependensi
        run: uv sync --frozen

      - name: Jalankan test integrasi + cakupan
        run: >-
          uv run pytest -q -W ignore -m integration
          --cov=app --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage-integration.xml

      - name: Unggah data cakupan integrasi
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cakupan-integrasi
          path: |
            backend/coverage-integration.data
            backend/coverage-integration.xml
          if-no-files-found: warn

  cakupan-gabungan:
    name: Backend — ringkasan cakupan gabungan
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration]
    # Tetap jalan walau salah satu job gagal agar cakupan terlihat. Gerbang di bawah
    # tetap gagal bila data tidak lengkap (lihat langkah "Gabungkan").
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Pasang uv (dengan cache dependensi)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Pasang dependensi
        run: uv sync --frozen

      - name: Unduh data cakupan
        uses: actions/download-artifact@v8
        with:
          pattern: cakupan-*
          path: backend/cov-in
          merge-multiple: true

      - name: Gabungkan cakupan unit + integrasi
        run: |
          shopt -s nullglob
          files=(cov-in/*.data)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Tidak ada data cakupan (job unit/integrasi gagal sebelum menghasilkan data)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Gerbang butuh KEDUA data: tanpa salah satunya angka gabungan menyesatkan.
          if [ ! -e cov-in/coverage-unit.data ] || [ ! -e cov-in/coverage-integration.data ]; then
            echo "Data cakupan unit atau integrasi tidak lengkap; gerbang tidak bisa dievaluasi." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          export COVERAGE_FILE=coverage-gabungan.data
          uv run coverage combine --keep "${files[@]}"
          uv run coverage xml -o coverage.xml
          uv run coverage json -o coverage.json
          {
            echo "## Cakupan backend (unit + integrasi)"
            echo
            echo "Gerbang memblok: baris >= 90% dan cabang >= 80% (CONSTRAINTS.md)."
            echo
            uv run coverage report --format=markdown --skip-empty
          } >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --skip-empty

      # Gerbang cakupan (#70): dua ambang terpisah dibaca dari data gabungan hasil
      # `coverage combine` di atas (bukan dari cache). Gagal -> job merah.
      - name: Gerbang cakupan (baris >= 90%, cabang >= 80%)
        run: |
          export COVERAGE_FILE=coverage-gabungan.data
          status=0
          uv run python scripts/cakupan_gerbang.py coverage.json > gerbang.txt 2>&1 || status=$?
          cat gerbang.txt
          {
            echo
            echo "### Gerbang cakupan"
            echo '```'
            cat gerbang.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Unggah coverage.xml gabungan
        if: ${{ hashFiles('backend/coverage.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-gabungan
          path: backend/coverage.xml

  frontend:
    name: Frontend — tsc, test + cakupan, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Env build minimal, tanpa secret: hanya URL publik non-rahasia.
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      # Versi selaras mise.toml (node 26, pnpm 12) dan frontend/Dockerfile.
      # pnpm dipasang lebih dulu supaya setup-node bisa men-cache pnpm store.
      - name: Pasang pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "12"
          package_json_file: frontend/package.json

      - name: Pasang Node (dengan cache pnpm store)
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # pnpm-workspace.yaml (minimumReleaseAgeExclude) wajib ada di direktori frontend.
      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      # Gerbang cakupan: coverage.thresholds di vitest.config.mts (global: baris >= 90%,
      # cabang >= 80%). Di bawah ambang -> vitest keluar != 0 -> job merah.
      - name: Test + gerbang cakupan (baris >= 90%, cabang >= 80%)
        run: |
          # Tanpa `shell:` eksplisit Actions memakai `bash -e` TANPA pipefail; aktifkan sendiri
          # agar status = kode keluar vitest, bukan tee (terbukti di run uji gerbang #71).
          set -o pipefail
          status=0
          pnpm test:coverage 2>&1 | tee test-coverage.txt || status=$?
          # Ringkasan ke tab Summary + peringatan per berkas (tidak memblok sendirian).
          node scripts/cakupan-ringkasan.mjs >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then
            {
              echo
              echo "### Test/gerbang cakupan GAGAL"
              echo '```'
              grep -E "ERROR:|FAIL|Coverage for" test-coverage.txt | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Unggah laporan cakupan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cakupan-frontend
          path: |
            frontend/coverage/
          if-no-files-found: warn

      - name: Build produksi
        run: pnpm run build
